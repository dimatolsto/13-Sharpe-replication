id: P0
name: paper_reproduction
universe_mode: current_constituents
period_mode: paper_three_windows
paper_test_windows:
  # Interpret paper labels 2010–2011, 2015–2016, 2020–2021 as half-open
  # one-year intervals [2010,2011), [2015,2016), [2020,2021). These closed
  # calendar-year equivalents are paired with explicit half-open scaling windows below.
  - start: 2010-01-01
    end: 2010-12-31
  - start: 2015-01-01
    end: 2015-12-31
  - start: 2020-01-01
    end: 2020-12-31
return_lag_sessions: 1
raw_signal_price_required: false
point_in_time_membership_required: false
transaction_cost_bp: 0.60
paper_scaling: true
scaling:
  mode: paper_walk_forward
  windows:
    - train_start: 2005-01-01
      train_end: 2010-01-01
      test_start: 2010-01-01
      test_end: 2011-01-01
    - train_start: 2010-01-01
      train_end: 2015-01-01
      test_start: 2015-01-01
      test_end: 2016-01-01
    - train_start: 2015-01-01
      train_end: 2020-01-01
      test_start: 2020-01-01
      test_end: 2021-01-01
certified: false
