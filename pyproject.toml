[project]
name = "sharpe-replication"
version = "0.1.0"
description = "Independent, bias-controlled replication of the 13-Sharpe drift-regime equity factor paper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "httpx>=0.27",
  "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
agent = ["openai-agents>=0.2"]
acquire = ["yfinance==1.5.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
drift-replication = "sharpe_replication.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharpe_replication"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
